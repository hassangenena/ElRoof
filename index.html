<style>
body{min-height:max(884px,100dvh);background:#131313;color:#e5e2e1;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
.screen{display:none;}
.screen.active{display:flex;}
#hubScreen.active,#loginScreen.active{display:flex;}
#pantryScreen.active,#arrivalsScreen.active,#broadcastsScreen.active{display:block;}

/* Pattern overlay */
.pattern-overlay{position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l2.5 12.5L45 15l-12.5 2.5L30 30l-2.5-12.5L15 15l12.5-2.5z' fill='%23e6d4a8' fill-opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;}

/* Loader */
#loader{position:fixed;inset:0;background:#131313;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .7s;}
#loader.gone{opacity:0;pointer-events:none;}
.loader-roof{width:90px;height:64px;background:#c9b88e;border-radius:3px;position:relative;box-shadow:7px 7px 0 #8a7048,0 24px 50px rgba(0,0,0,.6);animation:lb 1.6s ease infinite;}
.loader-roof::before{content:'';position:absolute;inset:8px;border:1.5px dashed rgba(160,128,80,.3);border-radius:2px;}
@keyframes lb{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}

/* Entrance animation */
.entrance-sweep{animation:sweep .8s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes sweep{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* Arched top cards */
.arched-top{border-top-left-radius:200px;border-top-right-radius:200px;}

/* Dot divider */
.dot-divider{display:flex;align-items:center;width:100%;margin:20px 0;}
.dot-divider::before,.dot-divider::after{content:'';flex:1;height:1px;background:rgba(201,184,142,.2);}
.dot-divider-star{margin:0 14px;color:#e6d4a8;font-size:13px;}

/* Toggle switch */
.toggle-wrap{position:relative;display:inline-block;}
.toggle-input{position:absolute;opacity:0;width:0;height:0;}
.toggle-track{width:72px;height:36px;background:#2a2a2a;border-radius:999px;cursor:pointer;transition:all .4s ease;border:1px solid rgba(230,212,168,.2);display:block;position:relative;}
.toggle-track::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;background:#e6d4a8;border-radius:50%;transition:all .4s cubic-bezier(.68,-.55,.265,1.55);box-shadow:0 0 12px rgba(230,212,168,.3);}
.toggle-input:checked+.toggle-track{background:#544827;}
.toggle-input:checked+.toggle-track::after{left:40px;background:#131313;}

/* Time modal */
.time-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.time-modal-bg.open{opacity:1;pointer-events:all;}
.time-modal-sheet{width:100%;max-width:480px;background:#2a2a2a;border-top-left-radius:24px;border-top-right-radius:24px;padding:1.5rem 1.5rem 2.5rem;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1);border-top:1px solid rgba(230,212,168,.15);}
.time-modal-sheet::before{content:'';display:block;width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 1.4rem;}
.time-modal-bg.open .time-modal-sheet{transform:translateY(0);}
.time-btn{padding:12px 4px;background:rgba(255,255,255,.06);border:1px solid rgba(201,184,142,.18);border-radius:8px;color:#cdc6b8;font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer;text-align:center;transition:all .13s;min-height:44px;}
.time-btn:active,.time-btn.sel{background:rgba(230,212,168,.18);border-color:#e6d4a8;color:#e6d4a8;font-weight:700;}

/* Toast */
.toast{position:fixed;bottom:6rem;left:50%;transform:translateX(-50%) translateY(70px);background:#202020;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:10px 18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#e5e2e1;z-index:600;transition:transform .32s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;pointer-events:none;box-shadow:0 8px 28px rgba(0,0,0,.5);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.green{border-color:rgba(100,200,130,.3);}
.toast.gold{border-color:rgba(230,212,168,.3);}

/* Signal line for broadcasts */
.signal-line{position:absolute;left:16px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,#e6d4a8 0%,transparent 100%);opacity:.15;}

/* Member card for arrivals */
.member-row{border:1px solid rgba(201,184,142,.12);transition:transform .2s,border-color .2s;}
.member-row:active{transform:scale(.98);}
.member-row.here{border-color:rgba(201,184,142,.25);}
</style>

<script>
/* ── DATA ── */
const MEMBERS=['Hassan','ahmed','marwan','malek','zeyad','yassin','loay','seif','omar'];
const ITEMS=[
  {k:'sagayer',l:'Sagayer',icon:'inventory_2',sub:'Premium Selection'},
  {k:'ahwa',   l:'Ahwa',   icon:'coffee',      sub:'Dark Roasted'},
  {k:'sokar',  l:'Sokar',  icon:'grain',       sub:'Fine Crystals'},
  {k:'shay',   l:'Shay',   icon:'energy_savings_leaf', sub:'Black Leaf'},
];
const TIMES=['10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM','7:00 PM','8:00 PM','9:00 PM','10:00 PM'];

let me=null,selIdx=null,selTime=null,modalIdx=null,unsub=null,state={},currentTab='hub';

/* ── COOKIES ── */
function setCookie(n,v,d=365){const x=new Date();x.setTime(x.getTime()+d*864e5);document.cookie=`${n}=${v};expires=${x.toUTCString()};path=/;SameSite=Lax`;}
function getCookie(n){const m=document.cookie.match('(^|;)\\s*'+n+'\\s*=\\s*([^;]+)');return m?m[2]:null;}
function deleteCookie(n){document.cookie=n+'=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';}

/* ── BOOT ── */
async function boot(){
  await new Promise(r=>setTimeout(r,1200));
  document.getElementById('loader').classList.add('gone');
  const saved=getCookie('elroof_member');
  if(saved!==null){
    const idx=parseInt(saved);
    if(idx>=0&&idx<MEMBERS.length){me=idx;enterMain();return;}
  }
  buildLogin();
  document.getElementById('loginScreen').classList.add('active');
}

/* ── LOGIN ── */
function buildLogin(){
  const g=document.getElementById('loginGrid');
  g.innerHTML='';
  MEMBERS.forEach((name,i)=>{
    const b=document.createElement('button');
    b.className='py-3 px-2 bg-surface-container-high border border-primary/15 rounded-xl text-on-surface-variant font-body-md text-sm font-medium transition-all active:scale-95';
    b.textContent=name;
    b.onclick=()=>{
      selIdx=i;
      document.getElementById('lerr').textContent='';
      document.getElementById('loginBtn').disabled=false;
      document.querySelectorAll('#loginGrid button').forEach(x=>{
        x.classList.remove('bg-primary','text-on-primary','border-primary');
        x.classList.add('bg-surface-container-high','text-on-surface-variant','border-primary/15');
      });
      b.classList.remove('bg-surface-container-high','text-on-surface-variant','border-primary/15');
      b.classList.add('bg-primary','text-on-primary','border-primary');
    };
    g.appendChild(b);
  });
}

function doLogin(){
  if(selIdx===null){showErr('Pick your name.');return;}
  me=selIdx;setCookie('elroof_member',me);enterMain();
}

function doLogout(){
  deleteCookie('elroof_member');
  if(unsub)unsub();
  me=null;selIdx=null;
  document.getElementById('loginBtn').disabled=true;
  document.getElementById('bottomNav').style.display='none';
  ['hubScreen','pantryScreen','arrivalsScreen','broadcastsScreen'].forEach(id=>document.getElementById(id).classList.remove('active'));
  buildLogin();
  document.getElementById('loginScreen').classList.add('active');
}

function showErr(m){const e=document.getElementById('lerr');e.textContent=m;setTimeout(()=>e.textContent='',2000);}

/* ── ENTER MAIN ── */
function enterMain(){
  document.getElementById('loginScreen').classList.remove('active');
  const initials=MEMBERS[me].slice(0,2).toUpperCase();
  document.getElementById('hubAvatar').textContent=initials;
  document.getElementById('pantryAvatar').textContent=initials;
  const now=new Date();
  document.getElementById('hubDateLabel').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  document.getElementById('bottomNav').style.display='flex';
  showTab('hub');
  subscribeState();
}

/* ── TAB NAVIGATION ── */
function showTab(tab){
  currentTab=tab;
  ['hub','pantry','arrivals','broadcasts'].forEach(t=>{
    document.getElementById(t+'Screen').classList.remove('active');
    const nb=document.getElementById('nav-'+t);
    if(nb){
      nb.classList.remove('bg-primary-container','text-on-primary-container','rounded-full','px-sm','py-xs','scale-90');
      nb.classList.add('text-outline');
    }
  });
  document.getElementById(tab+'Screen').classList.add('active');
  const activeBtn=document.getElementById('nav-'+tab);
  if(activeBtn){
    activeBtn.classList.remove('text-outline');
    activeBtn.classList.add('bg-primary-container','text-on-primary-container','rounded-full','px-sm','py-xs','scale-90');
  }
  // hide compose on non-broadcast tabs
  const compose=document.querySelector('#broadcastsScreen section.fixed');
  if(compose) compose.style.display=tab==='broadcasts'?'block':'none';
}

/* ── FIREBASE ── */
function today(){return new Date().toISOString().split('T')[0];}
function dbRef(p){return window._ref(window._db,p);}
async function write(path,val){await window._set(dbRef(`days/${today()}/${path}`),val);}

function subscribeState(){
  if(unsub)unsub();
  unsub=window._onValue(dbRef(`days/${today()}`),snap=>{
    const raw=snap.val()||{};
    state={coming:raw.coming||{},broadcasts:raw.broadcasts||[],items:{}};
    ITEMS.forEach(it=>{state.items[it.k]=raw.items?.[it.k]??'available';});
    renderAll();
  });
}

/* ── RENDER ── */
function renderAll(){renderHub();renderPantry();renderArrivals();renderBroadcast();}

function renderHub(){
  const coming=state.coming||{};
  const count=Object.values(coming).filter(Boolean).length;
  document.getElementById('hubCount').textContent=count;
  document.getElementById('hubSubtitle').textContent=
    count===0?'No one on the roof yet':
    count===1?'1 member on the roof':
    `${count} members on the roof`;
}

function renderPantry(){
  const items=state.items||{};
  const l=document.getElementById('pantryList');
  l.innerHTML='';
  ITEMS.forEach((it,idx)=>{
    const on=items[it.k]==='available';
    const wrap=document.createElement('div');
    if(idx>0){
      const div=document.createElement('div');
      div.className='dot-divider';
      div.innerHTML='<span class="dot-divider-star material-symbols-outlined text-sm">grade</span>';
      l.appendChild(div);
    }
    wrap.className='arched-top bg-surface-container-high p-6 flex flex-col gap-5';
    wrap.innerHTML=`
      <div class="flex justify-between items-start">
        <div>
          <h3 class="font-headline-md text-headline-md text-primary">${it.l}</h3>
          <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-tighter mt-1">${it.sub}</p>
        </div>
        <span class="material-symbols-outlined text-outline">${it.icon}</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="font-body-md text-on-surface-variant" id="pstatus-${it.k}">${on?'Stocked':'Empty'}</span>
        <label class="toggle-wrap">
          <input type="checkbox" class="toggle-input" ${on?'checked':''} onchange="toggleItem('${it.k}')"/>
          <span class="toggle-track"></span>
        </label>
      </div>
    `;
    l.appendChild(wrap);
  });
}

function renderArrivals(){
  const coming=state.coming||{};
  const count=Object.values(coming).filter(Boolean).length;
  document.getElementById('arrivalCount').textContent=`${count}/9`;
  const l=document.getElementById('arrivalsList');
  l.innerHTML='';
  MEMBERS.forEach((name,i)=>{
    const isSelf=i===me;
    const time=coming[i];
    const card=document.createElement('div');
    card.className='member-row arched-top bg-surface-container-high p-5 flex items-center justify-between cursor-pointer'+(time?' here':'');
    if(isSelf||!time) card.onclick=()=>openTimeModal(i,!!time);
    const initials=name.slice(0,2).toUpperCase();
    card.innerHTML=`
      <div class="flex items-center gap-4">
        <div class="w-11 h-11 rounded-full border-2 ${time?'border-primary/30':'border-outline/20'} flex items-center justify-center bg-surface-container font-headline-md text-sm font-bold ${time?'text-primary':'text-outline'}">
          ${initials}
        </div>
        <div>
          <h3 class="font-body-lg text-sm font-bold ${time?'text-primary':'text-on-surface-variant'}">${name}</h3>
          <p class="font-label-sm text-label-sm ${time?'text-outline':'text-outline-variant'}">${time||'Not yet set'}</p>
        </div>
      </div>
      <div class="flex flex-col items-end gap-1">
        ${time
          ?`<span class="px-3 py-1 bg-primary text-on-primary rounded-full text-[10px] font-bold uppercase tracking-wider">Coming</span>`
          :`<span class="px-3 py-1 border border-outline-variant text-outline-variant rounded-full text-[10px] font-bold uppercase tracking-wider">${isSelf?'Tap to set':'Awaiting'}</span>`
        }
      </div>
    `;
    l.appendChild(card);
  });
}

function renderBroadcast(){
  const broadcasts=state.broadcasts||[];
  const container=document.getElementById('broadcastDisplay');
  if(broadcasts.length===0){
    container.innerHTML=`
      <div class="relative pl-10">
        <div class="absolute left-0 top-2 w-8 h-8 bg-surface-container-high rounded-full flex items-center justify-center border border-primary/20">
          <span class="material-symbols-outlined text-primary" style="font-size:16px;">podcasts</span>
        </div>
        <div class="bg-surface-container-high p-5 rounded-xl border border-primary/10">
          <p class="text-on-surface-variant text-sm italic">Nothing broadcast yet today.</p>
        </div>
      </div>`;
    return;
  }
  container.innerHTML='';
  const icons=['podcasts','campaign','record_voice_over','spatial_audio','hearing'];
  broadcasts.forEach((b,idx)=>{
    const el=document.createElement('div');
    el.className='relative pl-10 mb-5';
    const icon=icons[idx%icons.length];
    el.innerHTML=`
      <div class="absolute left-0 top-2 w-8 h-8 bg-surface-container-high rounded-full flex items-center justify-center border border-primary/20">
        <span class="material-symbols-outlined text-primary" style="font-size:16px;">${icon}</span>
      </div>
      <div class="bg-surface-container-high p-5 rounded-xl border border-primary/10">
        <div class="flex justify-between items-center mb-2">
          <span class="font-label-sm text-label-sm text-primary tracking-widest uppercase">${esc(b.from)}</span>
          <span class="font-label-sm text-label-sm text-outline opacity-60">${formatTime(b.ts)}</span>
        </div>
        <p class="text-on-surface text-sm leading-relaxed">${esc(b.text)}</p>
      </div>`;
    container.appendChild(el);
  });
}

/* ── TIME MODAL ── */
function openTimeModal(idx,alreadyHere){
  modalIdx=idx;selTime=null;
  document.getElementById('modalName').textContent=MEMBERS[idx];
  const g=document.getElementById('timeGrid');
  g.innerHTML='';
  const cur=state.coming?.[idx];
  TIMES.forEach(t=>{
    const b=document.createElement('button');
    b.className='time-btn'+(t===cur?' sel':'');
    b.textContent=t;
    if(t===cur)selTime=t;
    b.onclick=()=>{selTime=t;document.querySelectorAll('.time-btn').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');};
    g.appendChild(b);
  });
  document.getElementById('modalRemove').style.display=alreadyHere?'block':'none';
  document.getElementById('timeModal').classList.add('open');
}
function closeTimeModal(){document.getElementById('timeModal').classList.remove('open');}
function onModalBgClick(e){if(e.target===document.getElementById('timeModal'))closeTimeModal();}

async function confirmTime(){
  if(!selTime){showToast('Pick a time first','gold');return;}
  await write(`coming/${modalIdx}`,selTime);
  closeTimeModal();showToast(`See you at ${selTime} ☀️`,'green');
}
async function setNotComing(){
  await write(`coming/${modalIdx}`,null);
  closeTimeModal();showToast('Removed from today','');
}

/* ── TOGGLE ITEM ── */
async function toggleItem(k){
  const cur=state.items?.[k]??'available';
  const next=cur==='available'?'not available':'available';
  await write(`items/${k}`,next);
  const lbl=ITEMS.find(i=>i.k===k)?.l||k;
  showToast(`${lbl}: ${next}`,next==='available'?'green':'');
}

/* ── BROADCAST ── */
async function sendBroadcast(){
  const inp=document.getElementById('bInput');
  const txt=inp.value.trim();
  if(!txt)return;
  const existing=state.broadcasts||[];
  const updated=[...existing,{text:txt,from:MEMBERS[me],ts:Date.now()}];
  await write('broadcasts',updated);
  inp.value='';showToast('Broadcast sent!','gold');
}

/* ── TOAST ── */
let _tt;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast show'+(type?' '+type:'');
  clearTimeout(_tt);
  _tt=setTimeout(()=>t.classList.remove('show'),2600);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatTime(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}

document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('bInput');
  if(inp)inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendBroadcast();}});
  // hide compose initially
  const compose=document.querySelector('#broadcastsScreen section.fixed');
  if(compose)compose.style.display='none';
});
</script>
</body>
</html>
